<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jokguboard — 족구 점수판</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: #0b2744;
      color: #f3efe4;
      line-height: 1.55;
    }
    main { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
    a { color: #f0c14b; }
    .card {
      background: #123152;
      border-radius: 16px;
      padding: 20px;
      margin: 16px 0;
    }
    .apk-name { font-family: ui-monospace, Consolas, monospace; background: #0b2744; padding: 2px 8px; border-radius: 6px; }
    .hero-gif { display: block; width: 100%; height: auto; border-radius: 16px; margin: 0 0 20px; }
    .btn {
      display: inline-block;
      background: #e8a317;
      color: #1a1408;
      font-weight: 700;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 10px;
      margin: 6px 8px 6px 0;
    }
    /* VISIT_STATS_PV: 허브 하단. 되돌리: 이 규칙·#appVisitStats·initVisitStats 삭제 */
    .app-visit-stats {
      margin: 8px 0 0;
      color: rgba(243, 239, 228, 0.72);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <!-- HERO_GIF: 랜딩 상단. 되돌리: src를 /jokgu-argument-fast.gif 로 -->
    <img class="hero-gif" src="/home.gif" alt="족구 경기 장면" width="720" height="720" />
    <h1>족구 점수판</h1>
    <p>족구 15점 · Futnet 11점(최대 15) · 3세트 2선승. 설정에서 종목을 고릅니다. 웹과 Android 태블릿에서 사용합니다.</p>
    <p>
      <a class="btn" href="/play">점수판 열기</a>
      <a class="btn" href="/jokgu_scoreboard.html">직접 열기</a>
    </p>
    <div class="card">
      <h2>Android APK</h2>
      <p>현재 설치 파일: <span class="apk-name" id="apkName">app-debug-1120_1137-jokicon.apk</span></p>
      <p><a href="/downloads/app-debug-1120_1137-jokicon.apk">APK 다운로드</a></p>
      <p>설치 안내: 위 파일명을 확인한 뒤 다운로드합니다. 출처를 모르는 APK는 설치하지 마세요.</p>
    </div>
    <div class="card">
      <h2>도움말</h2>
      <p>
        <a href="/help.html">한국어</a> ·
        <a href="/help_en.html">English</a> ·
        <a href="/help_zh.html">中文</a>
      </p>
    </div>
    <p class="app-visit-stats" id="appVisitStats" hidden aria-hidden="true"></p>
  </main>
  <script>
    /* VISIT_STATS_PV: Vercel /api/visit·/api/stats. 되돌리: 이 스크립트 삭제 */
    (function initVisitStats() {
      var el = document.getElementById("appVisitStats");
      if (!el) return;
      var host = location.hostname;
      var isLocal = host === "localhost" || host === "127.0.0.1";

      function fmt(n) {
        var x = parseInt(n, 10);
        return isNaN(x) || x < 0 ? "0" : String(x);
      }

      function render(data) {
        if (!data || !data.domestic || !data.foreign) {
          el.hidden = true;
          el.setAttribute("aria-hidden", "true");
          return;
        }
        el.textContent =
          "국내전체: " +
          fmt(data.domestic.total) +
          ", 국내오늘: " +
          fmt(data.domestic.today) +
          ", 국외전체: " +
          fmt(data.foreign.total) +
          ", 국외오늘: " +
          fmt(data.foreign.today);
        el.hidden = false;
        el.setAttribute("aria-hidden", "false");
      }

      function loadStats() {
        fetch("/api/stats", { cache: "no-store" })
          .then(function (r) {
            return r.ok ? r.json() : null;
          })
          .then(render)
          .catch(function () {
            el.hidden = true;
          });
      }

      if (!isLocal) {
        var dayKey = "jokgu-visit-day";
        var today = new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Seoul",
        }).format(new Date());
        var counted = "";
        try {
          counted = localStorage.getItem(dayKey) || "";
        } catch (e) {}
        if (counted !== today) {
          fetch("/api/visit", { method: "POST", keepalive: true })
            .then(function (r) {
              if (!r || !r.ok) return;
              try {
                localStorage.setItem(dayKey, today);
              } catch (e) {}
            })
            .catch(function () {});
        }
        loadStats();
      }
    })();
  </script>
</body>
</html>
