<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090f" />
  <title>족구 점수판</title>
  <!-- JK_OFL_FONTS: Noto Sans KR · Jua · Do Hyeon · Orbitron (SIL OFL 1.1). 되돌리: 이 link 삭제 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&family=Do+Hyeon&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    /* JK_BOARD_LOOK: 청 어두운 카드·백 밝은 카드·바깥 서브 띠. 되돌리: 이 style을 이전 커밋으로 복원 */
    :root {
      --ink: #0b1220;
      --paper: #f8fafc;
      --cyan: #22d3ee;
      --gold: #fbbf24;
      --font: "Jua", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      color: #e2e8f0;
      font-family: var(--font);
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #07090f;
      background-image:
        radial-gradient(ellipse 90% 50% at 8% 0%, rgba(34, 211, 238, 0.13), transparent 52%),
        radial-gradient(ellipse 70% 40% at 94% 6%, rgba(129, 140, 248, 0.14), transparent 50%);
    }
    body.is-apk-match { cursor: none; }
    .shell {
      min-height: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
    }
    .topbar {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      flex-shrink: 0;
      background: rgba(10, 14, 26, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      color: #fff;
      padding: 8px 10px;
    }
    .topbar button, .lang-btn {
      font: inherit;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 7px 11px;
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      cursor: pointer;
    }
    .topbar button:hover, .lang-btn:hover { background: rgba(34, 211, 238, 0.16); }
    .lang-pack { margin-left: auto; display: flex; gap: 4px; }
    .lang-btn.is-on {
      background: rgba(34, 211, 238, 0.22);
      border-color: rgba(34, 211, 238, 0.45);
      color: #ecfeff;
    }
    .hint-line {
      min-height: 1.3em;
      padding: 2px 6px;
      color: #94a3b8;
      font-size: 13px;
    }
    .court {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 8px;
      min-height: 0;
    }
    .court.is-ends-swapped { flex-direction: row-reverse; }
    .side {
      position: relative;
      flex: 1;
      border-radius: 22px;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      min-width: 0;
      min-height: 180px;
      overflow: hidden;
    }
    .side.cyan {
      color: #e0f2fe;
      background: linear-gradient(150deg, #0c1d47 0%, #0e2660 42%, #060e2a 100%);
      border: 1px solid rgba(56, 189, 248, 0.2);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }
    .side.ivory {
      color: var(--ink);
      background: linear-gradient(155deg, #ffffff 0%, #f5f7ff 55%, #edf0ff 100%);
      border: 1px solid rgba(199, 210, 254, 0.55);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.18);
    }
    .side.is-serve-now { box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.55), 0 18px 40px rgba(0, 0, 0, 0.4); }
    .side.ivory.is-serve-now { box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.45), 0 10px 28px rgba(15, 23, 42, 0.2); }
    #sideBlue .rot-col { order: 0; }
    #sideBlue .side-main { order: 1; }
    #sideWhite .side-main { order: 0; }
    #sideWhite .rot-col { order: 1; }
    .court.is-ends-swapped #sideBlue .rot-col { order: 1; }
    .court.is-ends-swapped #sideBlue .side-main { order: 0; }
    .court.is-ends-swapped #sideWhite .rot-col { order: 0; }
    .court.is-ends-swapped #sideWhite .side-main { order: 1; }
    .rot-col {
      flex: 0 0 clamp(58px, 12vmin, 88px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 10px 6px;
    }
    .side.cyan .rot-col {
      border-right: 1px solid rgba(56, 189, 248, 0.22);
      background: linear-gradient(180deg, rgba(6, 182, 212, 0.08), rgba(15, 23, 42, 0.28));
    }
    .side.ivory .rot-col {
      border-left: 1px solid rgba(165, 180, 252, 0.35);
      background: linear-gradient(180deg, rgba(129, 140, 248, 0.1), rgba(241, 245, 249, 0.7));
    }
    .court.is-ends-swapped .side.cyan .rot-col {
      border-right: 0;
      border-left: 1px solid rgba(56, 189, 248, 0.22);
    }
    .court.is-ends-swapped .side.ivory .rot-col {
      border-left: 0;
      border-right: 1px solid rgba(165, 180, 252, 0.35);
    }
    /* JK_DISK_GLYPH: 1·2·3. 되돌리: .rot-dot 블록 삭제 */
    .rot-dot {
      width: clamp(44px, 10vmin, 72px);
      height: clamp(44px, 10vmin, 72px);
      border-radius: 12px;
      border: 2px solid rgba(103, 232, 249, 0.42);
      background: linear-gradient(155deg, rgba(15, 23, 42, 0.95), rgba(8, 145, 178, 0.7));
      color: #ecfeff;
      display: grid;
      place-items: center;
      font-size: clamp(18px, 4vmin, 28px);
      cursor: pointer;
    }
    .side.ivory .rot-dot {
      border-color: rgba(165, 180, 252, 0.55);
      background: linear-gradient(155deg, #312e81, #1e1b4b);
      color: #eef2ff;
    }
    .rot-dot.is-server {
      transform: scale(1.12);
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.35);
    }
    .side-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 10px 12px 14px;
    }
    .team-title {
      align-self: center;
      font-size: clamp(16px, 2.2vw, 24px);
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 10px;
    }
    .side.cyan .team-title {
      color: #ecfeff;
      border: 1px solid rgba(103, 232, 249, 0.38);
      background: rgba(15, 23, 42, 0.55);
    }
    .side.ivory .team-title {
      color: #1e293b;
      border: 1px solid rgba(99, 102, 241, 0.32);
      background: linear-gradient(180deg, #fff, #f1f5f9);
    }
    .point-num {
      flex: 1;
      display: grid;
      place-items: center;
      font-size: clamp(64px, 16vw, 200px);
      line-height: 0.9;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
    }
    .side.cyan .point-num { color: #f8fafc; }
    .side.ivory .point-num { color: #0f172a; }
    .mid {
      flex: 0 0 clamp(120px, 18vmin, 190px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(10, 14, 26, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: #f1f5f9;
      border-radius: 22px;
      padding: 12px 8px;
    }
    .set-label { font-size: 12px; letter-spacing: 0.08em; color: #94a3b8; }
    .set-row {
      font-size: clamp(28px, 5vw, 56px);
      color: var(--gold);
      font-variant-numeric: tabular-nums;
    }
    .deuce-pill {
      display: none;
      background: rgba(251, 191, 36, 0.18);
      color: var(--gold);
      border: 1px solid rgba(251, 191, 36, 0.45);
      font-weight: 700;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 13px;
    }
    .deuce-pill.is-on { display: inline-block; }
    .banner {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(7, 9, 15, 0.72);
      z-index: 40;
      place-items: center;
      padding: 16px;
    }
    .banner.is-open { display: grid; }
    .banner-card, .sheet {
      background: var(--paper);
      color: var(--ink);
      border-radius: 16px;
      padding: 20px;
      width: min(520px, 100%);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }
    .banner-card h2, .sheet h2 { margin: 0 0 12px; }
    .sheet label { display: block; margin: 10px 0 4px; font-size: 13px; }
    .sheet .chk {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 14px 0 4px;
      font-size: 13px;
    }
    .sheet .chk input { width: auto; }
    .sheet input, .sheet select {
      width: 100%;
      font: inherit;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }
    .row-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .row-btns button, .sheet button {
      font: inherit;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      background: #0e2660;
      color: #fff;
    }
    .row-btns button.ghost { background: #e2e8f0; color: #222; }
    .help-frame {
      width: min(820px, 96vw);
      height: min(70vh, 640px);
      border: 0;
      background: #fff;
      border-radius: 12px;
    }
    .serve-guide {
      text-align: center;
      font-size: 14px;
      padding: 4px 8px;
      color: #cbd5e1;
    }
    @media (max-width: 720px) {
      .court, .court.is-ends-swapped { flex-direction: column; }
      .mid { flex: 0 0 auto; flex-direction: row; justify-content: space-around; }
    }
    /* JK_LOOK_PACK: 기본·네온·카드·경기장. 되돌리: 이 블록·inLook·boardLook 삭제 */
    body.look-glow {
      background-color: #020308;
      background-image:
        repeating-linear-gradient(115deg, rgba(0, 255, 210, 0.07) 0 2px, transparent 2px 18px),
        radial-gradient(ellipse at 12% 10%, rgba(0, 255, 210, 0.18), transparent 45%),
        radial-gradient(ellipse at 88% 18%, rgba(255, 60, 160, 0.16), transparent 42%);
    }
    body.look-glow .topbar {
      background: #05070f;
      border-color: rgba(0, 255, 210, 0.35);
    }
    body.look-glow .side.cyan {
      background: #041018;
      border: 2px solid #00ffd2;
      box-shadow: 0 0 24px rgba(0, 255, 210, 0.28);
      color: #d7fff6;
    }
    body.look-glow .side.ivory {
      background: #120814;
      border: 2px solid #ff4fc3;
      box-shadow: 0 0 24px rgba(255, 79, 195, 0.25);
      color: #ffe6f6;
    }
    body.look-glow .side.ivory .point-num,
    body.look-glow .side.ivory .team-title { color: #ffe6f6; }
    body.look-glow .mid {
      background: #05070f;
      border: 1px solid rgba(0, 255, 210, 0.4);
      color: #d7fff6;
    }
    body.look-glow .set-row { color: #00ffd2; }
    body.look-paper {
      background: #cbb79a;
      background-image: linear-gradient(180deg, #d8c6a8, #b89a72);
      color: #2a2118;
    }
    body.look-paper .topbar {
      background: #3b2f22;
      border-color: #7a6248;
    }
    body.look-paper .hint-line { color: #4a3b2c; }
    body.look-paper .side.cyan,
    body.look-paper .side.ivory {
      background: #f4ead6;
      border: 3px solid #2a2118;
      box-shadow: 6px 6px 0 #2a2118;
      color: #2a2118;
    }
    body.look-paper .side.cyan .point-num,
    body.look-paper .side.ivory .point-num { color: #1a140e; }
    body.look-paper .side.cyan .team-title,
    body.look-paper .side.ivory .team-title {
      color: #1a140e;
      background: #efe3cc;
      border-color: #2a2118;
    }
    body.look-paper .mid {
      background: #3b2f22;
      border: 3px solid #2a2118;
      color: #f4ead6;
    }
    body.look-paper .set-row { color: #e2b15a; }
    body.look-paper .serve-guide { color: #e8dcc6; }
    body.look-field {
      background-color: #0b1a10;
      background-image:
        radial-gradient(ellipse at 50% 120%, rgba(80, 180, 70, 0.28), transparent 50%),
        linear-gradient(180deg, #102414, #071208);
    }
    body.look-field .topbar {
      background: rgba(8, 22, 12, 0.92);
      border-color: rgba(140, 210, 90, 0.35);
    }
    body.look-field .side.cyan {
      background: linear-gradient(160deg, #12301c, #08150c);
      border: 2px solid #8cd25a;
      color: #e8ffe0;
    }
    body.look-field .side.ivory {
      background: linear-gradient(160deg, #f3f7ea, #dce8c8);
      border: 2px solid #8cd25a;
      color: #143018;
    }
    body.look-field .mid {
      background: #102414;
      border: 2px solid rgba(140, 210, 90, 0.45);
    }
    body.look-field .set-row { color: #b6f07a; }
    /* JK_SIMPLE: 큰 점수·세트만. 되돌리: 이 블록·#btnSimple·simpleMode 삭제 */
    body.is-simple .topbar button:not(#btnUndo):not(#btnSimple),
    body.is-simple .lang-pack,
    body.is-simple .rot-col,
    body.is-simple .hint-line { display: none; }
    body.is-simple .point-num { font-size: clamp(96px, 24vw, 280px); }
    body.is-simple .set-row { font-size: clamp(40px, 8vw, 88px); }
    body.is-simple .team-title { font-size: clamp(18px, 3vw, 32px); }
    /* JK_SKIN_REMAP: 족구 DOM(.side.cyan/.ivory/.mid)용 팔레트. 탁구장 사진·liverec 없음. 되돌리: 이 블록·inLook 추가분 삭제 */
    body.look-arena { background: #12100c; }
    body.look-arena .side.cyan { background: #1a1408; border-color: #e8a317; color: #fff3d6; }
    body.look-arena .side.ivory { background: #f4ead6; border-color: #8a6a2a; color: #1a1408; }
    body.look-arena .mid { background: #1a1408; border-color: #e8a317; }
    body.look-arena .set-row { color: #e8a317; }
    body.look-broadcast { background: #0a0c10; }
    body.look-broadcast .side.cyan { background: #0d1b2a; border-color: #4cc9f0; }
    body.look-broadcast .side.ivory { background: #f7f7f2; border-color: #c1121f; color: #111; }
    body.look-broadcast .mid { background: #111; border-color: #f5f5f5; }
    body.look-broadcast .set-row { color: #ffd60a; }
    body.look-live,
    body.look-live2 {
      background-color: #142414;
      background-image: linear-gradient(180deg, #1c3320, #0c180e);
    }
    body.look-live .side.cyan,
    body.look-live2 .side.cyan { background: rgba(12, 40, 18, 0.92); border-color: #9ae66e; }
    body.look-live .side.ivory,
    body.look-live2 .side.ivory { background: rgba(244, 248, 232, 0.94); border-color: #6a8f3a; color: #143018; }
    body.look-live .mid,
    body.look-live2 .mid { background: #102010; }
    body.look-live .set-row,
    body.look-live2 .set-row { color: #c6f07a; }
    body.look-urban { background: #1b1d22; }
    body.look-urban .side.cyan { background: #23262e; border-color: #7dd3fc; }
    body.look-urban .side.ivory { background: #eceff3; border-color: #64748b; color: #111827; }
    body.look-urban .mid { background: #111318; }
    body.look-desert { background: #3a2a18; }
    body.look-desert .side.cyan { background: #4a3218; border-color: #e2b15a; color: #fff4d6; }
    body.look-desert .side.ivory { background: #f3e2c4; border-color: #a67c3a; color: #3a2410; }
    body.look-desert .mid { background: #2a1c10; }
    body.look-desert .set-row { color: #e2b15a; }
    body.look-underwater { background: #062033; }
    body.look-underwater .side.cyan { background: #08344d; border-color: #22d3ee; }
    body.look-underwater .side.ivory { background: #d7f3ff; border-color: #38bdf8; color: #082f45; }
    body.look-underwater .mid { background: #041824; }
    body.look-valley { background: #14220f; }
    body.look-valley .side.cyan { background: #1c3314; border-color: #86efac; }
    body.look-valley .side.ivory { background: #eef6e4; border-color: #65a30d; color: #1a2e10; }
    body.look-valley .mid { background: #101c0c; }
    body.look-waterfall { background: #0c1c28; }
    body.look-waterfall .side.cyan { background: #123044; border-color: #67e8f9; }
    body.look-waterfall .side.ivory { background: #e8f4fb; border-color: #38bdf8; color: #0f2740; }
    body.look-waterfall .mid { background: #0a1620; }
    body.look-space { background: #05060c; }
    body.look-space .side.cyan { background: #0b1020; border-color: #818cf8; }
    body.look-space .side.ivory { background: #eef0ff; border-color: #6366f1; color: #1e1b4b; }
    body.look-space .mid { background: #070812; }
    body.look-space .set-row { color: #c4b5fd; }
    body.look-snow { background: #9bb4c8; }
    body.look-snow .side.cyan { background: #1e3a5f; border-color: #e2e8f0; }
    body.look-snow .side.ivory { background: #f8fafc; border-color: #94a3b8; color: #0f172a; }
    body.look-snow .mid { background: #1e293b; }
    body.look-vegas { background: #1a0810; }
    body.look-vegas .side.cyan { background: #2a0c18; border-color: #fbbf24; color: #fff7d6; }
    body.look-vegas .side.ivory { background: #fff1f2; border-color: #fb7185; color: #4c0519; }
    body.look-vegas .mid { background: #12040a; }
    body.look-vegas .set-row { color: #fbbf24; }
    body.look-ttable,
    body.look-ttable1 { background: #143018; }
    body.look-ttable .side.cyan,
    body.look-ttable1 .side.cyan { background: #0b2744; border-color: #38bdf8; }
    body.look-ttable .side.ivory,
    body.look-ttable1 .side.ivory { background: #f4f1ea; border-color: #cbd5e1; color: #111; }
    body.look-ttable .mid,
    body.look-ttable1 .mid { background: #102414; }
    body.look-stadium,
    body.look-stadium1 { background: #101410; }
    body.look-stadium .side.cyan,
    body.look-stadium1 .side.cyan { background: #17301c; border-color: #86efac; }
    body.look-stadium .side.ivory,
    body.look-stadium1 .side.ivory { background: #f3f7ea; border-color: #4ade80; color: #143018; }
    body.look-stadium .mid,
    body.look-stadium1 .mid { background: #0c140c; }
    body.look-tball { background: #102018; }
    body.look-tball .side.cyan { background: #163024; border-color: #facc15; }
    body.look-tball .side.ivory { background: #fffbeb; border-color: #ca8a04; color: #422006; }
    body.look-tball .mid { background: #0c1810; }
    body.look-tball .set-row { color: #facc15; }
    body.look-sunset { background: #2a1210; }
    body.look-sunset .side.cyan { background: #3a1814; border-color: #fb923c; color: #fff7ed; }
    body.look-sunset .side.ivory { background: #fff1e6; border-color: #f97316; color: #431407; }
    body.look-sunset .mid { background: #1a0c0a; }
    body.look-sunset .set-row { color: #fdba74; }
    body.look-cyber3d { background: #050816; }
    body.look-cyber3d .side.cyan { background: #081428; border: 2px solid #22d3ee; box-shadow: 0 0 18px rgba(34, 211, 238, 0.35); }
    body.look-cyber3d .side.ivory { background: #120824; border: 2px solid #c084fc; color: #f5e8ff; }
    body.look-cyber3d .side.ivory .point-num,
    body.look-cyber3d .side.ivory .team-title { color: #f5e8ff; }
    body.look-cyber3d .mid { background: #050816; border-color: #22d3ee; }
    body.look-arena3d { background: #0c0c0c; }
    body.look-arena3d .side.cyan { background: #16120c; border: 2px solid #fbbf24; }
    body.look-arena3d .side.ivory { background: #f8f1e0; border: 2px solid #78716c; color: #1c1917; }
    body.look-arena3d .mid { background: #111; border-color: #fbbf24; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <button type="button" id="btnUndo" data-i18n="undo">되돌리기</button>
      <button type="button" id="btnSimple" data-i18n="simple">심플</button>
      <button type="button" id="btnFresh" data-i18n="fresh">새 경기</button>
      <button type="button" id="btnSetup" data-i18n="setup">설정</button>

    var LS_KEY = "jokgu_scoreboard_state_v1";
    var GAME_TARGET = 15;
    var DEUCE_FLOOR = 14;
    var LONG_PRESS_MS = 500;
    var PLUS_COOLDOWN_MS = 1500;
    var SERIES_WINS = { bo3_2: 2, bo5_3: 3, bo7_4: 4 };
    var FONT_FAM = {
      jua: '"Jua", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif',
      noto: '"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif',
      dohyeon: '"Do Hyeon", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif',

    };
    var LOOK_IDS = [
      "plain", "glow", "paper", "field", "arena", "broadcast", "live", "live2",
      "urban", "desert", "underwater", "valley", "waterfall", "space", "snow",
      "vegas", "ttable", "ttable1", "stadium", "stadium1", "tball", "sunset",
      "cyber3d", "arena3d"
    ];

    var scoreBlue = 0;
    var scoreWhite = 0;
    var setBlue = 0;
    var setWhite = 0;
    var nameBlue = "청";
    var nameWhite = "백";
    var teamsSwapped = false;
    var serveChoice = null;
    var serveAnchor = null;
    var lang = "ko";
    var boardLook = "plain";
    var boardFont = "jua";
    var matchSeries = "bo3_2";
    var ttsOn = false;
    var simpleMode = false;
    var historyStack = [];
    var lastPlusAt = { blue: 0, white: 0 };

    var elCourt = document.getElementById("court");
    var elScoreBlue = document.getElementById("scoreBlue");
    var elScoreWhite = document.getElementById("scoreWhite");
    var elSetLeft = document.getElementById("setLeft");
    var elSetRight = document.getElementById("setRight");
    var elNameBlue = document.getElementById("nameBlue");
    var elNameWhite = document.getElementById("nameWhite");

    var elSideWhite = document.getElementById("sideWhite");
    var elDeuce = document.getElementById("deucePill");
    var elServeGuide = document.getElementById("serveGuide");
    var elStatus = document.getElementById("statusLine");
    var elWinBanner = document.getElementById("winBanner");
    var elSetupBanner = document.getElementById("setupBanner");
    var elHelpBanner = document.getElementById("helpBanner");

    function t(key) {
      var pack = I18N[lang] || I18N.ko;
      return pack[key] || I18N.ko[key] || key;
    }
    function fill(key, map) {
      var s = t(key);
      Object.keys(map || {}).forEach(function (k) {
        s = s.replace("{" + k + "}", map[k]);
      });
      return s;
    }
    function nameFor(team) {
      return team === "white" ? nameWhite : nameBlue;
    }
    function opposite(team) {
      return team === "white" ? "blue" : "white";
    }

    /* JK_CORE: 15점·2점 차·14:14 듀스. 되돌리: isGameWin·maybeFinishGame 삭제 */
    function isGameWin(b, w) {
      if (b === w) return false;
      var hi = Math.max(b, w);
      var lo = Math.min(b, w);
      if (hi >= GAME_TARGET && lo <= DEUCE_FLOOR - 1) return true;
      if (b >= DEUCE_FLOOR && w >= DEUCE_FLOOR && hi - lo >= 2) return true;
      return false;
    }
    function winsNeeded() {
      return SERIES_WINS[matchSeries] || 2;
    }
    function isMatchSeriesWon(sb, sw) {
      var n = winsNeeded();
      return sb >= n || sw >= n;
    }
    function gameWinnerTeam(b, w) {
      return b > w ? "blue" : "white";
    }
    function isServePickPending() {
      return serveAnchor == null && serveChoice == null && scoreBlue + scoreWhite === 0;
    }
    function computeServeTeam() {
      if (serveChoice === "blue" || serveChoice === "white") return serveChoice;
      if (serveAnchor === "blue" || serveAnchor === "white") return serveAnchor;
      return null;
    }
    function isMatchLocked() {
      return isMatchSeriesWon(setBlue, setWhite);
    }
    function isWinBannerOpen() {
      return elWinBanner.classList.contains("is-open");
    }
    function inDeuceWindow() {
      var hi = Math.max(scoreBlue, scoreWhite);
      var lo = Math.min(scoreBlue, scoreWhite);
      return scoreBlue >= DEUCE_FLOOR && scoreWhite >= DEUCE_FLOOR && hi - lo < 2;
    }

    function snapshot() {
      return {
        scoreBlue: scoreBlue,
        scoreWhite: scoreWhite,
        setBlue: setBlue,
        setWhite: setWhite,
        nameBlue: nameBlue,
        nameWhite: nameWhite,
        swapped: teamsSwapped === true,
        serveChoice: serveChoice,
        serveAnchor: serveAnchor,
        lang: lang,
        look: boardLook,
        font: boardFont,
        series: matchSeries,
        tts: ttsOn === true,
        simple: simpleMode === true
      };
    }
    function normalizeLook(v) {
      return LOOK_IDS.indexOf(v) >= 0 ? v : "plain";
    }
    function normalizeFont(v) {
      return FONT_FAM[v] ? v : "jua";
    }
    function normalizeSeries(v) {
      return SERIES_WINS[v] ? v : "bo3_2";
    }
    function applyLook() {
      LOOK_IDS.forEach(function (id) {
        document.body.classList.toggle("look-" + id, boardLook === id);
      });
    }
    function applyFont() {
      document.documentElement.style.setProperty("--font", FONT_FAM[boardFont] || FONT_FAM.jua);
    }
    function applySimpleMode() {
      document.body.classList.toggle("is-simple", simpleMode === true);
      var btn = document.getElementById("btnSimple");
      if (btn) {
        btn.textContent = simpleMode ? t("simpleOff") : t("simple");
        btn.setAttribute("aria-pressed", simpleMode ? "true" : "false");
      }
    }
    function restore(s) {
      if (!s) return;
      scoreBlue = s.scoreBlue | 0;
      scoreWhite = s.scoreWhite | 0;
      setBlue = s.setBlue | 0;
      setWhite = s.setWhite | 0;
      nameBlue = String(s.nameBlue || "청").slice(0, 20);
      nameWhite = String(s.nameWhite || "백").slice(0, 20);
      teamsSwapped = s.swapped === true;
      serveChoice = s.serveChoice === "white" || s.serveChoice === "blue" ? s.serveChoice : null;
      serveAnchor = s.serveAnchor === "white" || s.serveAnchor === "blue" ? s.serveAnchor : null;
      if (s.lang === "en" || s.lang === "zh" || s.lang === "ko") lang = s.lang;
      if (s.look) boardLook = normalizeLook(s.look);
      if (s.font) boardFont = normalizeFont(s.font);
      if (s.series) matchSeries = normalizeSeries(s.series);
      ttsOn = s.tts === true;
      simpleMode = s.simple === true;
    }
    function pushHistory() {
      historyStack.push(snapshot());
      if (historyStack.length > 80) historyStack.shift();
    }
    function persistState() {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify(snapshot()));
      } catch (err) {}
    }
    function loadState() {
      try {
        var raw = localStorage.getItem(LS_KEY);
        if (!raw) return;
        restore(JSON.parse(raw));
      } catch (err) {}
    }

    function applyLang() {
      document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        el.textContent = t(el.getAttribute("data-i18n"));
      });
      document.querySelectorAll(".lang-btn").forEach(function (btn) {
        btn.classList.toggle("is-on", btn.getAttribute("data-lang") === lang);
      });
    }

    function paint() {
      elScoreBlue.textContent = String(scoreBlue);
      elScoreWhite.textContent = String(scoreWhite);
      elNameBlue.textContent = nameBlue;
      elNameWhite.textContent = nameWhite;
      elSetLeft.textContent = String(teamsSwapped ? setWhite : setBlue);
      elSetRight.textContent = String(teamsSwapped ? setBlue : setWhite);
      elCourt.classList.toggle("is-ends-swapped", teamsSwapped);
      var serve = computeServeTeam();
      elSideBlue.classList.toggle("is-serve-now", serve === "blue");
      elSideWhite.classList.toggle("is-serve-now", serve === "white");
      document.querySelectorAll(".rot-dot").forEach(function (dot) {
        var team = dot.getAttribute("data-team");
        var slot = dot.getAttribute("data-slot");
        var on = serve === team && slot === "1";
        dot.classList.toggle("is-server", on);
      });
      elDeuce.classList.toggle("is-on", inDeuceWindow());
      if (isServePickPending()) elServeGuide.textContent = t("needServe");
      else if (serve) elServeGuide.textContent = fill("serving", { name: nameFor(serve) });
      else elServeGuide.textContent = "";
      document.body.classList.toggle("is-apk-match", isApkMatchLr());
      applyLook();
      applyFont();
      applyLang();
      applySimpleMode();
      pushBle(false);
    }

    /* JK_BLE_PUSH: 화면 좌·우 점수를 시계 GATT로. 되돌리: pushBle·AndroidBleScore 호출 삭제 */
    function pushBle(force) {
      if (!window.AndroidBleScore) return;
      var lg = teamsSwapped ? scoreWhite : scoreBlue;
      var rg = teamsSwapped ? scoreBlue : scoreWhite;
      var ls = teamsSwapped ? setWhite : setBlue;
      var rs = teamsSwapped ? setBlue : setWhite;
      try {
        if (force && AndroidBleScore.setBoardScoreForce) {
          AndroidBleScore.setBoardScoreForce(lg, rg, ls, rs);
        } else if (AndroidBleScore.setBoardScore) {
          AndroidBleScore.setBoardScore(lg, rg, ls, rs);
        }
      } catch (err) {}
    }

    /* JK_TTS: 점수·서브·세트·경기. 되돌리: speakPhrase 호출 삭제 */
    function speakPhrase(text) {
      if (!ttsOn || !text) return;
      var tag = lang === "zh" ? "zh-CN" : lang === "en" ? "en-US" : "ko-KR";
      var uid = "jk-" + Date.now();
      if (window.AndroidTTS && AndroidTTS.speak) {
        try {
          AndroidTTS.speak(text, tag, uid);
          return;
        } catch (err) {}
      }
      if (window.speechSynthesis) {
        try {
          var u = new SpeechSynthesisUtterance(text);
          u.lang = tag;
          speechSynthesis.cancel();
          speechSynthesis.speak(u);
        } catch (err) {}
      }
    }
    function speakScoreNow() {
      var leftN = teamsSwapped ? nameWhite : nameBlue;
      var rightN = teamsSwapped ? nameBlue : nameWhite;
      var lg = teamsSwapped ? scoreWhite : scoreBlue;
      var rg = teamsSwapped ? scoreBlue : scoreWhite;
      speakPhrase(leftN + " " + lg + ", " + rightN + " " + rg);
    }

    function setStatus(msg) {
      elStatus.textContent = msg || "";
    }

    function openWinBanner(title, body) {
      document.getElementById("winTitle").textContent = title;
      document.getElementById("winBody").textContent = body || "";
      elWinBanner.classList.add("is-open");
      elWinBanner.setAttribute("aria-hidden", "false");
    }
    function closeWinBanner() {
      elWinBanner.classList.remove("is-open");
      elWinBanner.setAttribute("aria-hidden", "true");
    }

    function maybeFinishGame() {
      if (!isGameWin(scoreBlue, scoreWhite)) {
        paint();
        persistState();
        return;
      }
      var winner = gameWinnerTeam(scoreBlue, scoreWhite);
      if (winner === "blue") setBlue += 1;
      else setWhite += 1;
      var matchEnded = isMatchSeriesWon(setBlue, setWhite);
      var prevAnchor = serveAnchor === "blue" || serveAnchor === "white" ? serveAnchor : null;
      scoreBlue = 0;
      scoreWhite = 0;
      serveAnchor = null;
      if (!matchEnded && prevAnchor) {
        teamsSwapped = !teamsSwapped;
        serveChoice = opposite(prevAnchor);
      } else {
        serveChoice = null;
      }
      persistState();
      paint();
      if (matchEnded) {
        openWinBanner(fill("matchWin", { name: nameFor(winner), wins: String(winsNeeded()) }), "");
        speakPhrase(fill("matchWin", { name: nameFor(winner), wins: String(winsNeeded()) }));
      } else {
        openWinBanner(fill("gameWin", { name: nameFor(winner) }), t("courtChange"));
        speakPhrase(fill("gameWin", { name: nameFor(winner) }));
      }
    }

    /* JK_DELTA: 족구 전용 가산. 탁구 단복식·핸디·Pro 없음. 되돌리: applyDelta 삭제 */
    function applyDelta(team, delta, sourceTag) {
      if (!delta) return;
      if (isWinBannerOpen()) return;
      if (delta > 0 && isMatchLocked()) {
        setStatus(t("matchLocked"));
        return;
      }
      if (delta > 0 && computeServeTeam() == null) {
        setStatus(t("needServe"));
        return;
      }
      pushHistory();
      var oldN = scoreBlue + scoreWhite;
      if (team === "white") scoreWhite = Math.max(0, scoreWhite + delta);
      else scoreBlue = Math.max(0, scoreBlue + delta);
      var newN = scoreBlue + scoreWhite;
      if (newN === 0) {
        if (delta < 0 && oldN > 0 && (serveAnchor === "blue" || serveAnchor === "white")) {
          serveChoice = serveAnchor;
          serveAnchor = null;
        } else {
          serveAnchor = null;
          serveChoice = null;
        }
      } else if (oldN === 0 && delta > 0) {
        serveAnchor = serveChoice === "blue" || serveChoice === "white" ? serveChoice : team;
        serveChoice = null;
      }
      persistState();
      paint();
      setStatus(fill(delta > 0 ? "plus" : "minus", { name: nameFor(team === "white" ? "white" : "blue") }));
      if (delta > 0) {
        var setsBefore = setBlue + setWhite;
        maybeFinishGame();
        if (setBlue + setWhite === setsBefore) speakScoreNow();
      }
    }

    function setServeChoice(team) {
      if (!isServePickPending()) return;
      if (team !== "blue" && team !== "white") return;
      pushHistory();
      serveChoice = team;
      persistState();
      paint();
      setStatus(fill("serving", { name: nameFor(team) }));
      speakPhrase(fill("serving", { name: nameFor(team) }));
    }

    function undoLast() {
      if (!historyStack.length) {
        setStatus(t("nothingUndo"));
        return;
      }
      restore(historyStack.pop());
      persistState();
      paint();
      closeWinBanner();
      setStatus(t("undone"));
    }

    function freshMatch() {
      if (!window.confirm(t("confirmFresh"))) return;
      pushHistory();
      scoreBlue = 0;
      scoreWhite = 0;
      setBlue = 0;
      setWhite = 0;
      teamsSwapped = false;
      serveChoice = null;
      serveAnchor = null;
      persistState();
      paint();
      closeWinBanner();
      setStatus(t("needServe"));
      pushBle(true);
    }

    function allowPlus(team) {
      var key = team === "white" ? "white" : "blue";
      var now = Date.now();
      if (now - lastPlusAt[key] < PLUS_COOLDOWN_MS) return false;
      lastPlusAt[key] = now;
      return true;
    }

    function leftTeam() { return teamsSwapped ? "white" : "blue"; }
    function rightTeam() { return teamsSwapped ? "blue" : "white"; }

    /* JK_APK_LR: 경기 중 화면 L/R +1, 길게 −1. 되돌리: 이 블록 삭제 */
    function isAndroidApk() {
      return !!(window.AndroidShell);
    }
    function isMatchInProgress() {
      if (isServePickPending()) return false;
      if (isMatchLocked()) return false;
      return true;
    }
    function isApkMatchLr() {
      return isAndroidApk() && isMatchInProgress();
    }

    var longTimer = null;
    var longTeam = null;
    var longDone = false;
    function cancelLong() {
      if (longTimer) clearTimeout(longTimer);
      longTimer = null;
      longTeam = null;
      longDone = false;
    }
    function beginLong(team) {
      cancelLong();
      longTeam = team;
      longTimer = setTimeout(function () {
        if (longTeam !== team) return;
        longDone = true;
        applyDelta(team, -1, "long");
      }, LONG_PRESS_MS);
    }
    function finishLong(team, doPlus) {
      if (longTeam !== team) {
        cancelLong();
        return false;
      }
      if (longTimer) clearTimeout(longTimer);
      longTimer = null;
      var wasLong = longDone;
      longTeam = null;
      longDone = false;
      if (wasLong) return true;
      if (doPlus && allowPlus(team)) applyDelta(team, 1, "tap");
      return false;
    }

    var lastFingerAt = 0;
    var mouseHoldTeam = null;

    function scoreTargetBlocked(el) {
      if (!el || !el.closest) return false;
      if (el.closest(".banner.is-open")) return true;
      if (el.closest(".topbar, .rot-dot, .team-title")) return true;
      if (isApkMatchLr()) {
        if (el.closest("input, textarea, select")) return true;
        return false;
      }
      return !!el.closest("button, a, input, textarea, select");
    }

    document.addEventListener("touchstart", function () {
      if (isApkMatchLr()) lastFingerAt = Date.now();
    }, { capture: true, passive: true });

    document.addEventListener("mousedown", function (e) {
      if (e.button !== 0 && e.button !== 2) return;
      if (e.pointerType === "touch") return;
      if (isApkMatchLr() && Date.now() - lastFingerAt < 500) return;
      if (!isApkMatchLr() && e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
      var team = e.button === 0 ? leftTeam() : rightTeam();
      if (isServePickPending()) {
        if (e.target.closest && e.target.closest(".rot-dot")) return;
        mouseHoldTeam = team;
        e.preventDefault();
        return;
      }
      if (!isApkMatchLr() && !isAndroidApk()) {
        if (scoreTargetBlocked(e.target)) return;
        if (!elCourt.contains(e.target)) return;
      } else if (scoreTargetBlocked(e.target) && !isApkMatchLr()) {
        return;
      } else if (isApkMatchLr() && e.target.closest && e.target.closest(".topbar, .banner")) {
        return;
      }
      if (!isApkMatchLr() && !elCourt.contains(e.target)) return;
      mouseHoldTeam = team;
      beginLong(team);
      e.preventDefault();
    });
    document.addEventListener("mouseup", function (e) {
      if (e.button !== 0 && e.button !== 2) return;
      if (!mouseHoldTeam) return;
      var team = mouseHoldTeam;
      mouseHoldTeam = null;
      if (isServePickPending()) {
        cancelLong();
        setServeChoice(team);
        e.preventDefault();
        return;
      }
      finishLong(team, true);
    });
    document.addEventListener("contextmenu", function (e) {
      if (elCourt.contains(e.target) || isApkMatchLr()) e.preventDefault();
    });

    function bindPoint(el) {
      el.addEventListener("pointerdown", function (e) {
        if (isApkMatchLr() && e.pointerType !== "touch") return;
        beginLong(el.getAttribute("data-team"));
      });
      el.addEventListener("pointerup", function (e) {
        if (isApkMatchLr() && e.pointerType !== "touch") return;
        finishLong(el.getAttribute("data-team"), true);
      });
      el.addEventListener("pointercancel", cancelLong);
    }
    bindPoint(elScoreBlue);
    bindPoint(elScoreWhite);

    document.querySelectorAll(".rot-dot").forEach(function (dot) {
      dot.addEventListener("click", function () {
        setServeChoice(dot.getAttribute("data-team"));
      });
    });
    elNameBlue.addEventListener("click", function () {
      if (isServePickPending()) setServeChoice("blue");
    });
    elNameWhite.addEventListener("click", function () {
      if (isServePickPending()) setServeChoice("white");
    });

    document.getElementById("btnUndo").addEventListener("click", undoLast);
    document.getElementById("btnFresh").addEventListener("click", freshMatch);
    document.getElementById("winOk").addEventListener("click", closeWinBanner);

    document.getElementById("btnSetup").addEventListener("click", function () {
      document.getElementById("inNameBlue").value = nameBlue;
      document.getElementById("inNameWhite").value = nameWhite;
      document.getElementById("inSeries").value = matchSeries;
      document.getElementById("inFont").value = boardFont;
      document.getElementById("inLook").value = boardLook;
      document.getElementById("inTts").checked = ttsOn === true;
      elSetupBanner.classList.add("is-open");
    });
    document.getElementById("setupCancel").addEventListener("click", function () {
      elSetupBanner.classList.remove("is-open");
    });
    document.getElementById("setupForm").addEventListener("submit", function (e) {
      e.preventDefault();
      pushHistory();
      nameBlue = String(document.getElementById("inNameBlue").value || "청").slice(0, 20);
      nameWhite = String(document.getElementById("inNameWhite").value || "백").slice(0, 20);
      matchSeries = normalizeSeries(document.getElementById("inSeries").value);
      boardFont = normalizeFont(document.getElementById("inFont").value);
      boardLook = normalizeLook(document.getElementById("inLook").value);
      ttsOn = document.getElementById("inTts").checked === true;
      persistState();
      paint();
      elSetupBanner.classList.remove("is-open");
      setStatus(t("saved"));
    });

    document.getElementById("btnSimple").addEventListener("click", function () {
      if (!simpleMode && isServePickPending()) {
        setStatus(t("simpleNeedServe"));
        return;
      }
      simpleMode = !simpleMode;
      persistState();
      paint();
    });

    document.getElementById("btnHelp").addEventListener("click", function () {
      var file = lang === "en" ? "help_en.html" : lang === "zh" ? "help_zh.html" : "help.html";
      document.getElementById("helpFrame").src = file;
      elHelpBanner.classList.add("is-open");
    });
    document.getElementById("helpClose").addEventListener("click", function () {
      elHelpBanner.classList.remove("is-open");
    });

    document.querySelectorAll(".lang-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        lang = btn.getAttribute("data-lang") || "ko";
        persistState();
        paint();
      });
    });

    loadState();
    paint();
    if (isServePickPending()) setStatus(t("needServe"));
  </script>
</body>
</html>
