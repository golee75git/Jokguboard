<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090f" />
  <title>족구 점수판</title>
  <!-- JK_OFL_FONTS: Noto Sans KR · Jua (SIL OFL 1.1). 되돌리: 이 link 삭제 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    /* JK_BOARD_LOOK: 청 어두운 카드·백 밝은 카드·바깥 서브 띠. 되돌리: 이 style을 이전 커밋으로 복원 */
    :root {
      --ink: #0b1220;
      --paper: #f8fafc;
      --cyan: #22d3ee;
      --gold: #fbbf24;
      --font: "Jua", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      color: #e2e8f0;
      font-family: var(--font);
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #07090f;
      background-image:
        radial-gradient(ellipse 90% 50% at 8% 0%, rgba(34, 211, 238, 0.13), transparent 52%),
        radial-gradient(ellipse 70% 40% at 94% 6%, rgba(129, 140, 248, 0.14), transparent 50%);
    }
    body.is-apk-match { cursor: none; }
    .shell {
      min-height: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
    }
    .topbar {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      flex-shrink: 0;
      background: rgba(10, 14, 26, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      color: #fff;
      padding: 8px 10px;
    }
    .topbar button, .lang-btn {
      font: inherit;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 7px 11px;
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      cursor: pointer;
    }
    .topbar button:hover, .lang-btn:hover { background: rgba(34, 211, 238, 0.16); }
    .lang-pack { margin-left: auto; display: flex; gap: 4px; }
    .lang-btn.is-on {
      background: rgba(34, 211, 238, 0.22);
      border-color: rgba(34, 211, 238, 0.45);
      color: #ecfeff;
    }
    .hint-line {
      min-height: 1.3em;
      padding: 2px 6px;
      color: #94a3b8;
      font-size: 13px;
    }
    .court {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 8px;
      min-height: 0;
    }
    .court.is-ends-swapped { flex-direction: row-reverse; }
    .side {
      position: relative;
      flex: 1;
      border-radius: 22px;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      min-width: 0;
      min-height: 180px;
      overflow: hidden;
    }
    .side.cyan {
      color: #e0f2fe;
      background: linear-gradient(150deg, #0c1d47 0%, #0e2660 42%, #060e2a 100%);
      border: 1px solid rgba(56, 189, 248, 0.2);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }
    .side.ivory {
      color: var(--ink);
      background: linear-gradient(155deg, #ffffff 0%, #f5f7ff 55%, #edf0ff 100%);
      border: 1px solid rgba(199, 210, 254, 0.55);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.18);
    }
    .side.is-serve-now { box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.55), 0 18px 40px rgba(0, 0, 0, 0.4); }
    .side.ivory.is-serve-now { box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.45), 0 10px 28px rgba(15, 23, 42, 0.2); }
    #sideBlue .rot-col { order: 0; }
    #sideBlue .side-main { order: 1; }
    #sideWhite .side-main { order: 0; }
    #sideWhite .rot-col { order: 1; }
    .court.is-ends-swapped #sideBlue .rot-col { order: 1; }
    .court.is-ends-swapped #sideBlue .side-main { order: 0; }
    .court.is-ends-swapped #sideWhite .rot-col { order: 0; }
    .court.is-ends-swapped #sideWhite .side-main { order: 1; }
    .rot-col {
      flex: 0 0 clamp(58px, 12vmin, 88px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 10px 6px;
    }
    .side.cyan .rot-col {
      border-right: 1px solid rgba(56, 189, 248, 0.22);
      background: linear-gradient(180deg, rgba(6, 182, 212, 0.08), rgba(15, 23, 42, 0.28));
    }
    .side.ivory .rot-col {
      border-left: 1px solid rgba(165, 180, 252, 0.35);
      background: linear-gradient(180deg, rgba(129, 140, 248, 0.1), rgba(241, 245, 249, 0.7));
    }
    .court.is-ends-swapped .side.cyan .rot-col {
      border-right: 0;
      border-left: 1px solid rgba(56, 189, 248, 0.22);
    }
    .court.is-ends-swapped .side.ivory .rot-col {
      border-left: 0;
      border-right: 1px solid rgba(165, 180, 252, 0.35);
    }
    /* JK_DISK_GLYPH: 1·2·3. 되돌리: .rot-dot 블록 삭제 */
    .rot-dot {
      width: clamp(44px, 10vmin, 72px);
      height: clamp(44px, 10vmin, 72px);
      border-radius: 12px;
      border: 2px solid rgba(103, 232, 249, 0.42);
      background: linear-gradient(155deg, rgba(15, 23, 42, 0.95), rgba(8, 145, 178, 0.7));
      color: #ecfeff;
      display: grid;
      place-items: center;
      font-size: clamp(18px, 4vmin, 28px);
      cursor: pointer;
    }
    .side.ivory .rot-dot {
      border-color: rgba(165, 180, 252, 0.55);
      background: linear-gradient(155deg, #312e81, #1e1b4b);
      color: #eef2ff;
    }
    .rot-dot.is-server {
      transform: scale(1.12);
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.35);
    }
    .side-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 10px 12px 14px;
    }
    .team-title {
      align-self: center;
      font-size: clamp(16px, 2.2vw, 24px);
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 10px;
    }
    .side.cyan .team-title {
      color: #ecfeff;
      border: 1px solid rgba(103, 232, 249, 0.38);
      background: rgba(15, 23, 42, 0.55);
    }
    .side.ivory .team-title {
      color: #1e293b;
      border: 1px solid rgba(99, 102, 241, 0.32);
      background: linear-gradient(180deg, #fff, #f1f5f9);
    }
    .point-num {
      flex: 1;
      display: grid;
      place-items: center;
      font-size: clamp(64px, 16vw, 200px);
      line-height: 0.9;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
    }
    .side.cyan .point-num { color: #f8fafc; }
    .side.ivory .point-num { color: #0f172a; }
    .mid {
      flex: 0 0 clamp(120px, 18vmin, 190px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(10, 14, 26, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: #f1f5f9;
      border-radius: 22px;
      padding: 12px 8px;
    }
    .set-label { font-size: 12px; letter-spacing: 0.08em; color: #94a3b8; }
    .set-row {
      font-size: clamp(28px, 5vw, 56px);
      color: var(--gold);
      font-variant-numeric: tabular-nums;
    }
    .deuce-pill {
      display: none;
      background: rgba(251, 191, 36, 0.18);
      color: var(--gold);
      border: 1px solid rgba(251, 191, 36, 0.45);
      font-weight: 700;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 13px;
    }
    .deuce-pill.is-on { display: inline-block; }
    .banner {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(7, 9, 15, 0.72);
      z-index: 40;
      place-items: center;
      padding: 16px;
    }
    .banner.is-open { display: grid; }
    .banner-card, .sheet {
      background: var(--paper);
      color: var(--ink);
      border-radius: 16px;
      padding: 20px;
      width: min(520px, 100%);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }
    .banner-card h2, .sheet h2 { margin: 0 0 12px; }
    .sheet label { display: block; margin: 10px 0 4px; font-size: 13px; }
    .sheet input, .sheet select {
      width: 100%;
      font: inherit;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }
    .row-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .row-btns button, .sheet button {
      font: inherit;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      background: #0e2660;
      color: #fff;
    }
    .row-btns button.ghost { background: #e2e8f0; color: #222; }
    .help-frame {
      width: min(820px, 96vw);
      height: min(70vh, 640px);
      border: 0;
      background: #fff;
      border-radius: 12px;
    }
    .serve-guide {
      text-align: center;
      font-size: 14px;
      padding: 4px 8px;
      color: #cbd5e1;
    }
    @media (max-width: 720px) {
      .court, .court.is-ends-swapped { flex-direction: column; }
      .mid { flex: 0 0 auto; flex-direction: row; justify-content: space-around; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <button type="button" id="btnUndo" data-i18n="undo">되돌리기</button>
      <button type="button" id="btnFresh" data-i18n="fresh">새 경기</button>
      <button type="button" id="btnSetup" data-i18n="setup">설정</button>
      <button type="button" id="btnHelp" data-i18n="help">도움말</button>
      <div class="lang-pack">
        <button type="button" class="lang-btn" data-lang="ko">한국어</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="zh">中文</button>
      </div>
    </div>
    <div class="hint-line" id="statusLine"></div>
    <div class="court" id="court">
      <section class="side cyan" id="sideBlue" data-team="blue">
        <div class="rot-col" aria-label="rotation">
          <div class="rot-dot" data-team="blue" data-slot="1">1</div>
          <div class="rot-dot" data-team="blue" data-slot="2">2</div>
          <div class="rot-dot" data-team="blue" data-slot="3">3</div>
        </div>
        <div class="side-main">
          <div class="team-title" id="nameBlue" data-team="blue">청</div>
          <div class="point-num" id="scoreBlue" data-team="blue" role="button" tabindex="0">0</div>
        </div>
      </section>
      <aside class="mid">
        <div class="set-label" data-i18n="sets">세트</div>
        <div class="set-row"><span id="setLeft">0</span> : <span id="setRight">0</span></div>
        <div class="deuce-pill" id="deucePill" data-i18n="deuce">듀스</div>
        <div class="serve-guide" id="serveGuide"></div>
      </aside>
      <section class="side ivory" id="sideWhite" data-team="white">
        <div class="rot-col" aria-label="rotation">
          <div class="rot-dot" data-team="white" data-slot="1">1</div>
          <div class="rot-dot" data-team="white" data-slot="2">2</div>
          <div class="rot-dot" data-team="white" data-slot="3">3</div>
        </div>
        <div class="side-main">
          <div class="team-title" id="nameWhite" data-team="white">백</div>
          <div class="point-num" id="scoreWhite" data-team="white" role="button" tabindex="0">0</div>
        </div>
      </section>
    </div>
  </div>

  <div class="banner" id="winBanner" aria-hidden="true">
    <div class="banner-card">
      <h2 id="winTitle"></h2>
      <p id="winBody"></p>
      <div class="row-btns">
        <button type="button" id="winOk" data-i18n="ok">확인</button>
      </div>
    </div>
  </div>

  <div class="banner" id="setupBanner" aria-hidden="true">
    <form class="sheet" id="setupForm">
      <h2 data-i18n="setup">설정</h2>
      <label for="inNameBlue" data-i18n="nameBlue">청 팀명</label>
      <input id="inNameBlue" maxlength="20" autocomplete="off" />
      <label for="inNameWhite" data-i18n="nameWhite">백 팀명</label>
      <input id="inNameWhite" maxlength="20" autocomplete="off" />
      <label for="inSeries" data-i18n="series">세트 규칙</label>
      <select id="inSeries">
        <option value="bo3_2">3세트 2선승</option>
      </select>
      <div class="row-btns">
        <button type="button" class="ghost" id="setupCancel" data-i18n="cancel">취소</button>
        <button type="submit" data-i18n="save">저장</button>
      </div>
    </form>
  </div>

  <div class="banner" id="helpBanner" aria-hidden="true">
    <div class="sheet" style="width:min(860px,96vw)">
      <h2 data-i18n="help">도움말</h2>
      <iframe class="help-frame" id="helpFrame" title="help"></iframe>
      <div class="row-btns">
        <button type="button" id="helpClose" data-i18n="ok">확인</button>
      </div>
    </div>
  </div>

  <script>
    /* JK_I18N: ko / en / zh. 되돌리: I18N 객체·applyLang 삭제 */
    var I18N = {
      ko: {
        undo: "되돌리기",
        fresh: "새 경기",
        setup: "설정",
        help: "도움말",
        sets: "세트",
        deuce: "듀스",
        ok: "확인",
        cancel: "취소",
        save: "저장",
        nameBlue: "청 팀명",
        nameWhite: "백 팀명",
        series: "세트 규칙",
        needServe: "0:0 — 선서브를 고르세요 (팀·원·화면 좌우)",
        serving: "{name} 서브",
        gameWin: "{name} 세트 승",
        courtChange: "코트를 바꿔 주세요.",
        matchWin: "{name} 경기 승 (2선승)",
        matchLocked: "경기가 이미 끝났습니다. 새 경기를 시작하세요.",
        confirmFresh: "점수를 모두 지우고 새 경기를 시작할까요?",
        undone: "직전 동작을 되돌렸습니다.",
        nothingUndo: "되돌릴 기록이 없습니다.",
        saved: "설정을 저장했습니다.",
        plus: "{name} +1",
        minus: "{name} −1"
      },
      en: {
        undo: "Undo",
        fresh: "New match",
        setup: "Settings",
        help: "Help",
        sets: "Sets",
        deuce: "Deuce",
        ok: "OK",
        cancel: "Cancel",
        save: "Save",
        nameBlue: "Blue name",
        nameWhite: "White name",
        series: "Series",
        needServe: "0–0 — choose first serve (team, disc, or L/R)",
        serving: "{name} serving",
        gameWin: "{name} wins the set",
        courtChange: "Please change ends.",
        matchWin: "{name} wins the match (first to 2)",
        matchLocked: "Match already finished. Start a new match.",
        confirmFresh: "Clear all scores and start a new match?",
        undone: "Last action undone.",
        nothingUndo: "Nothing to undo.",
        saved: "Settings saved.",
        plus: "{name} +1",
        minus: "{name} −1"
      },
      zh: {
        undo: "撤销",
        fresh: "新比赛",
        setup: "设置",
        help: "帮助",
        sets: "局分",
        deuce: "平分",
        ok: "确定",
        cancel: "取消",
        save: "保存",
        nameBlue: "青队名称",
        nameWhite: "白队名称",
        series: "局制",
        needServe: "0:0 — 请选择先发球（队伍、圆点或左右键）",
        serving: "{name} 发球",
        gameWin: "{name} 赢得本局",
        courtChange: "请交换场地。",
        matchWin: "{name} 赢得比赛（先胜两局）",
        matchLocked: "比赛已结束。请开始新比赛。",
        confirmFresh: "清除全部分数并开始新比赛？",
        undone: "已撤销上一步。",
        nothingUndo: "没有可撤销的记录。",
        saved: "设置已保存。",
        plus: "{name} +1",
        minus: "{name} −1"
      }
    };

    var LS_KEY = "jokgu_scoreboard_state_v1";
    var WINS_NEEDED = 2;
    var GAME_TARGET = 15;
    var DEUCE_FLOOR = 14;
    var LONG_PRESS_MS = 500;
    var PLUS_COOLDOWN_MS = 1500;

    var scoreBlue = 0;
    var scoreWhite = 0;
    var setBlue = 0;
    var setWhite = 0;
    var nameBlue = "청";
    var nameWhite = "백";
    var teamsSwapped = false;
    var serveChoice = null;
    var serveAnchor = null;
    var lang = "ko";
    var historyStack = [];
    var lastPlusAt = { blue: 0, white: 0 };

    var elCourt = document.getElementById("court");
    var elScoreBlue = document.getElementById("scoreBlue");
    var elScoreWhite = document.getElementById("scoreWhite");
    var elSetLeft = document.getElementById("setLeft");
    var elSetRight = document.getElementById("setRight");
    var elNameBlue = document.getElementById("nameBlue");
    var elNameWhite = document.getElementById("nameWhite");
    var elSideBlue = document.getElementById("sideBlue");
    var elSideWhite = document.getElementById("sideWhite");
    var elDeuce = document.getElementById("deucePill");
    var elServeGuide = document.getElementById("serveGuide");
    var elStatus = document.getElementById("statusLine");
    var elWinBanner = document.getElementById("winBanner");
    var elSetupBanner = document.getElementById("setupBanner");
    var elHelpBanner = document.getElementById("helpBanner");

    function t(key) {
      var pack = I18N[lang] || I18N.ko;
      return pack[key] || I18N.ko[key] || key;
    }
    function fill(key, map) {
      var s = t(key);
      Object.keys(map || {}).forEach(function (k) {
        s = s.replace("{" + k + "}", map[k]);
      });
      return s;
    }
    function nameFor(team) {
      return team === "white" ? nameWhite : nameBlue;
    }
    function opposite(team) {
      return team === "white" ? "blue" : "white";
    }

    /* JK_CORE: 15점·2점 차·14:14 듀스. 되돌리: isGameWin·maybeFinishGame 삭제 */
    function isGameWin(b, w) {
      if (b === w) return false;
      var hi = Math.max(b, w);
      var lo = Math.min(b, w);
      if (hi >= GAME_TARGET && lo <= DEUCE_FLOOR - 1) return true;
      if (b >= DEUCE_FLOOR && w >= DEUCE_FLOOR && hi - lo >= 2) return true;
      return false;
    }
    function isMatchSeriesWon(sb, sw) {
      return sb >= WINS_NEEDED || sw >= WINS_NEEDED;
    }
    function gameWinnerTeam(b, w) {
      return b > w ? "blue" : "white";
    }
    function isServePickPending() {
      return serveAnchor == null && serveChoice == null && scoreBlue + scoreWhite === 0;
    }
    function computeServeTeam() {
      if (serveChoice === "blue" || serveChoice === "white") return serveChoice;
      if (serveAnchor === "blue" || serveAnchor === "white") return serveAnchor;
      return null;
    }
    function isMatchLocked() {
      return isMatchSeriesWon(setBlue, setWhite);
    }
    function isWinBannerOpen() {
      return elWinBanner.classList.contains("is-open");
    }
    function inDeuceWindow() {
      var hi = Math.max(scoreBlue, scoreWhite);
      var lo = Math.min(scoreBlue, scoreWhite);
      return scoreBlue >= DEUCE_FLOOR && scoreWhite >= DEUCE_FLOOR && hi - lo < 2;
    }

    function snapshot() {
      return {
        scoreBlue: scoreBlue,
        scoreWhite: scoreWhite,
        setBlue: setBlue,
        setWhite: setWhite,
        nameBlue: nameBlue,
        nameWhite: nameWhite,
        swapped: teamsSwapped === true,
        serveChoice: serveChoice,
        serveAnchor: serveAnchor,
        lang: lang
      };
    }
    function restore(s) {
      if (!s) return;
      scoreBlue = s.scoreBlue | 0;
      scoreWhite = s.scoreWhite | 0;
      setBlue = s.setBlue | 0;
      setWhite = s.setWhite | 0;
      nameBlue = String(s.nameBlue || "청").slice(0, 20);
      nameWhite = String(s.nameWhite || "백").slice(0, 20);
      teamsSwapped = s.swapped === true;
      serveChoice = s.serveChoice === "white" || s.serveChoice === "blue" ? s.serveChoice : null;
      serveAnchor = s.serveAnchor === "white" || s.serveAnchor === "blue" ? s.serveAnchor : null;
      if (s.lang === "en" || s.lang === "zh" || s.lang === "ko") lang = s.lang;
    }
    function pushHistory() {
      historyStack.push(snapshot());
      if (historyStack.length > 80) historyStack.shift();
    }
    function persistState() {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify(snapshot()));
      } catch (err) {}
    }
    function loadState() {
      try {
        var raw = localStorage.getItem(LS_KEY);
        if (!raw) return;
        restore(JSON.parse(raw));
      } catch (err) {}
    }

    function applyLang() {
      document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        el.textContent = t(el.getAttribute("data-i18n"));
      });
      document.querySelectorAll(".lang-btn").forEach(function (btn) {
        btn.classList.toggle("is-on", btn.getAttribute("data-lang") === lang);
      });
    }

    function paint() {
      elScoreBlue.textContent = String(scoreBlue);
      elScoreWhite.textContent = String(scoreWhite);
      elNameBlue.textContent = nameBlue;
      elNameWhite.textContent = nameWhite;
      elSetLeft.textContent = String(teamsSwapped ? setWhite : setBlue);
      elSetRight.textContent = String(teamsSwapped ? setBlue : setWhite);
      elCourt.classList.toggle("is-ends-swapped", teamsSwapped);
      var serve = computeServeTeam();
      elSideBlue.classList.toggle("is-serve-now", serve === "blue");
      elSideWhite.classList.toggle("is-serve-now", serve === "white");
      document.querySelectorAll(".rot-dot").forEach(function (dot) {
        var team = dot.getAttribute("data-team");
        var slot = dot.getAttribute("data-slot");
        var on = serve === team && slot === "1";
        dot.classList.toggle("is-server", on);
      });
      elDeuce.classList.toggle("is-on", inDeuceWindow());
      if (isServePickPending()) elServeGuide.textContent = t("needServe");
      else if (serve) elServeGuide.textContent = fill("serving", { name: nameFor(serve) });
      else elServeGuide.textContent = "";
      document.body.classList.toggle("is-apk-match", isApkMatchLr());
      applyLang();
    }

    function setStatus(msg) {
      elStatus.textContent = msg || "";
    }

    function openWinBanner(title, body) {
      document.getElementById("winTitle").textContent = title;
      document.getElementById("winBody").textContent = body || "";
      elWinBanner.classList.add("is-open");
      elWinBanner.setAttribute("aria-hidden", "false");
    }
    function closeWinBanner() {
      elWinBanner.classList.remove("is-open");
      elWinBanner.setAttribute("aria-hidden", "true");
    }

    function maybeFinishGame() {
      if (!isGameWin(scoreBlue, scoreWhite)) {
        paint();
        persistState();
        return;
      }
      var winner = gameWinnerTeam(scoreBlue, scoreWhite);
      if (winner === "blue") setBlue += 1;
      else setWhite += 1;
      var matchEnded = isMatchSeriesWon(setBlue, setWhite);
      var prevAnchor = serveAnchor === "blue" || serveAnchor === "white" ? serveAnchor : null;
      scoreBlue = 0;
      scoreWhite = 0;
      serveAnchor = null;
      if (!matchEnded && prevAnchor) {
        teamsSwapped = !teamsSwapped;
        serveChoice = opposite(prevAnchor);
      } else {
        serveChoice = null;
      }
      persistState();
      paint();
      if (matchEnded) {
        openWinBanner(fill("matchWin", { name: nameFor(winner) }), "");
      } else {
        openWinBanner(fill("gameWin", { name: nameFor(winner) }), t("courtChange"));
      }
    }

    /* JK_DELTA: 족구 전용 가산. 탁구 단복식·핸디·Pro 없음. 되돌리: applyDelta 삭제 */
    function applyDelta(team, delta, sourceTag) {
      if (!delta) return;
      if (isWinBannerOpen()) return;
      if (delta > 0 && isMatchLocked()) {
        setStatus(t("matchLocked"));
        return;
      }
      if (delta > 0 && computeServeTeam() == null) {
        setStatus(t("needServe"));
        return;
      }
      pushHistory();
      var oldN = scoreBlue + scoreWhite;
      if (team === "white") scoreWhite = Math.max(0, scoreWhite + delta);
      else scoreBlue = Math.max(0, scoreBlue + delta);
      var newN = scoreBlue + scoreWhite;
      if (newN === 0) {
        if (delta < 0 && oldN > 0 && (serveAnchor === "blue" || serveAnchor === "white")) {
          serveChoice = serveAnchor;
          serveAnchor = null;
        } else {
          serveAnchor = null;
          serveChoice = null;
        }
      } else if (oldN === 0 && delta > 0) {
        serveAnchor = serveChoice === "blue" || serveChoice === "white" ? serveChoice : team;
        serveChoice = null;
      }
      persistState();
      paint();
      setStatus(fill(delta > 0 ? "plus" : "minus", { name: nameFor(team === "white" ? "white" : "blue") }));
      if (delta > 0) maybeFinishGame();
    }

    function setServeChoice(team) {
      if (!isServePickPending()) return;
      if (team !== "blue" && team !== "white") return;
      pushHistory();
      serveChoice = team;
      persistState();
      paint();
      setStatus(fill("serving", { name: nameFor(team) }));
    }

    function undoLast() {
      if (!historyStack.length) {
        setStatus(t("nothingUndo"));
        return;
      }
      restore(historyStack.pop());
      persistState();
      paint();
      closeWinBanner();
      setStatus(t("undone"));
    }

    function freshMatch() {
      if (!window.confirm(t("confirmFresh"))) return;
      pushHistory();
      scoreBlue = 0;
      scoreWhite = 0;
      setBlue = 0;
      setWhite = 0;
      teamsSwapped = false;
      serveChoice = null;
      serveAnchor = null;
      persistState();
      paint();
      closeWinBanner();
      setStatus(t("needServe"));
    }

    function allowPlus(team) {
      var key = team === "white" ? "white" : "blue";
      var now = Date.now();
      if (now - lastPlusAt[key] < PLUS_COOLDOWN_MS) return false;
      lastPlusAt[key] = now;
      return true;
    }

    function leftTeam() { return teamsSwapped ? "white" : "blue"; }
    function rightTeam() { return teamsSwapped ? "blue" : "white"; }

    /* JK_APK_LR: 경기 중 화면 L/R +1, 길게 −1. 되돌리: 이 블록 삭제 */
    function isAndroidApk() {
      return !!(window.AndroidShell);
    }
    function isMatchInProgress() {
      if (isServePickPending()) return false;
      if (isMatchLocked()) return false;
      return true;
    }
    function isApkMatchLr() {
      return isAndroidApk() && isMatchInProgress();
    }

    var longTimer = null;
    var longTeam = null;
    var longDone = false;
    function cancelLong() {
      if (longTimer) clearTimeout(longTimer);
      longTimer = null;
      longTeam = null;
      longDone = false;
    }
    function beginLong(team) {
      cancelLong();
      longTeam = team;
      longTimer = setTimeout(function () {
        if (longTeam !== team) return;
        longDone = true;
        applyDelta(team, -1, "long");
      }, LONG_PRESS_MS);
    }
    function finishLong(team, doPlus) {
      if (longTeam !== team) {
        cancelLong();
        return false;
      }
      if (longTimer) clearTimeout(longTimer);
      longTimer = null;
      var wasLong = longDone;
      longTeam = null;
      longDone = false;
      if (wasLong) return true;
      if (doPlus && allowPlus(team)) applyDelta(team, 1, "tap");
      return false;
    }

    var lastFingerAt = 0;
    var mouseHoldTeam = null;

    function scoreTargetBlocked(el) {
      if (!el || !el.closest) return false;
      if (el.closest(".banner.is-open")) return true;
      if (el.closest(".topbar, .rot-dot, .team-title")) return true;
      if (isApkMatchLr()) {
        if (el.closest("input, textarea, select")) return true;
        return false;
      }
      return !!el.closest("button, a, input, textarea, select");
    }

    document.addEventListener("touchstart", function () {
      if (isApkMatchLr()) lastFingerAt = Date.now();
    }, { capture: true, passive: true });

    document.addEventListener("mousedown", function (e) {
      if (e.button !== 0 && e.button !== 2) return;
      if (e.pointerType === "touch") return;
      if (isApkMatchLr() && Date.now() - lastFingerAt < 500) return;
      if (!isApkMatchLr() && e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
      var team = e.button === 0 ? leftTeam() : rightTeam();
      if (isServePickPending()) {
        if (e.target.closest && e.target.closest(".rot-dot")) return;
        mouseHoldTeam = team;
        e.preventDefault();
        return;
      }
      if (!isApkMatchLr() && !isAndroidApk()) {
        if (scoreTargetBlocked(e.target)) return;
        if (!elCourt.contains(e.target)) return;
      } else if (scoreTargetBlocked(e.target) && !isApkMatchLr()) {
        return;
      } else if (isApkMatchLr() && e.target.closest && e.target.closest(".topbar, .banner")) {
        return;
      }
      if (!isApkMatchLr() && !elCourt.contains(e.target)) return;
      mouseHoldTeam = team;
      beginLong(team);
      e.preventDefault();
    });
    document.addEventListener("mouseup", function (e) {
      if (e.button !== 0 && e.button !== 2) return;
      if (!mouseHoldTeam) return;
      var team = mouseHoldTeam;
      mouseHoldTeam = null;
      if (isServePickPending()) {
        cancelLong();
        setServeChoice(team);
        e.preventDefault();
        return;
      }
      finishLong(team, true);
    });
    document.addEventListener("contextmenu", function (e) {
      if (elCourt.contains(e.target) || isApkMatchLr()) e.preventDefault();
    });

    function bindPoint(el) {
      el.addEventListener("pointerdown", function (e) {
        if (isApkMatchLr() && e.pointerType !== "touch") return;
        beginLong(el.getAttribute("data-team"));
      });
      el.addEventListener("pointerup", function (e) {
        if (isApkMatchLr() && e.pointerType !== "touch") return;
        finishLong(el.getAttribute("data-team"), true);
      });
      el.addEventListener("pointercancel", cancelLong);
    }
    bindPoint(elScoreBlue);
    bindPoint(elScoreWhite);

    document.querySelectorAll(".rot-dot").forEach(function (dot) {
      dot.addEventListener("click", function () {
        setServeChoice(dot.getAttribute("data-team"));
      });
    });
    elNameBlue.addEventListener("click", function () {
      if (isServePickPending()) setServeChoice("blue");
    });
    elNameWhite.addEventListener("click", function () {
      if (isServePickPending()) setServeChoice("white");
    });

    document.getElementById("btnUndo").addEventListener("click", undoLast);
    document.getElementById("btnFresh").addEventListener("click", freshMatch);
    document.getElementById("winOk").addEventListener("click", closeWinBanner);

    document.getElementById("btnSetup").addEventListener("click", function () {
      document.getElementById("inNameBlue").value = nameBlue;
      document.getElementById("inNameWhite").value = nameWhite;
      elSetupBanner.classList.add("is-open");
    });
    document.getElementById("setupCancel").addEventListener("click", function () {
      elSetupBanner.classList.remove("is-open");
    });
    document.getElementById("setupForm").addEventListener("submit", function (e) {
      e.preventDefault();
      pushHistory();
      nameBlue = String(document.getElementById("inNameBlue").value || "청").slice(0, 20);
      nameWhite = String(document.getElementById("inNameWhite").value || "백").slice(0, 20);
      persistState();
      paint();
      elSetupBanner.classList.remove("is-open");
      setStatus(t("saved"));
    });

    document.getElementById("btnHelp").addEventListener("click", function () {
      var file = lang === "en" ? "help_en.html" : lang === "zh" ? "help_zh.html" : "help.html";
      document.getElementById("helpFrame").src = file;
      elHelpBanner.classList.add("is-open");
    });
    document.getElementById("helpClose").addEventListener("click", function () {
      elHelpBanner.classList.remove("is-open");
    });

    document.querySelectorAll(".lang-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        lang = btn.getAttribute("data-lang") || "ko";
        persistState();
        paint();
      });
    });

    loadState();
    paint();
    if (isServePickPending()) setStatus(t("needServe"));
  </script>
</body>
</html>
